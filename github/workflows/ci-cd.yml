name: Chatbot CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Backend setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Django Check
        run: |
          cd backend
          python manage.py check

      # Frontend setup
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend
        run: |
          cd frontend/my-app
          npm install

      - name: Build Frontend
        run: |
          cd frontend/my-app
          npm run build

      # Docker build
      - name: Build Containers
        run: docker-compose build

      - name: Run Containers
        run: docker-compose up -d